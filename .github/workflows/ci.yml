name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The TEST toolchain. jsdom 30 -> undici 8 needs >= 22; the package's
          # own engines floor is lower and is checked by the job below.
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test

  engines-floor:
    # Proves the `engines.node` claim without dragging the DOM test stack in:
    # build only, then import the built entry point.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm run build
